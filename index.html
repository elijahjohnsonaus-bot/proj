<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santa’s Workshop</title>
<meta name="theme-color" content="#12372a">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Georgia, "Palatino Linotype", Palatino, serif; color: #fbe9b7; }
  #stage { position: fixed; inset: 0; background: #000; }
  body.idle { cursor: none; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  #count { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; pointer-events: none;
    text-shadow: 0 0.04em 0.35em rgba(70, 0, 0, 0.7); padding: 0 4vw; }
  #num { font-size: min(30vh, 18vw); line-height: 1; font-weight: 700; font-variant-numeric: lining-nums; letter-spacing: -0.01em; }
  #num.greet { font-size: min(14vh, 9vw); }
  #label { font-size: min(7vh, 5vw); margin-top: 2vh; font-style: italic; letter-spacing: 0.01em; }
  #snd { position: absolute; bottom: calc(3vh + env(safe-area-inset-bottom)); right: calc(3vw + env(safe-area-inset-right));
    font: inherit; font-size: max(2.4vh, 15px); color: #fbe9b7; padding: max(0.8vh, 8px) max(1.6vh, 14px);
    background: rgba(18, 55, 42, 0.72); border: 1px solid rgba(251, 233, 183, 0.5); border-radius: 999px; cursor: pointer;
    opacity: 0; transition: opacity 0.5s; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #snd:focus-visible { outline: 3px solid #fbe9b7; outline-offset: 3px; opacity: 1; }
  body:not(.idle) #snd { opacity: 1; }
  #hint { position: absolute; bottom: calc(3vh + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: max(2.4vh, 15px); font-style: italic; color: #fbe9b7; opacity: 0.85; transition: opacity 1s; pointer-events: none;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); padding: 0 4vw; }
  /* on a phone held upright the hint would sit on top of the music button, so lift it clear */
  @media (orientation: portrait) { #hint { bottom: calc(3vh + env(safe-area-inset-bottom) + max(6vh, 56px)); } }
  @media (prefers-reduced-motion: reduce) { #snd, #hint { transition: none; } }
  #pick { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2vh; background: #000; font-size: max(3vh, 17px); color: #fbe9b7; cursor: auto;
    text-align: center; padding: 0 6vw; }
  #pick input { font: inherit; font-size: max(2.4vh, 16px); max-width: 100%; }
  #pick[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <video id="v" src="countdown-loop.mp4" autoplay muted loop playsinline preload="auto"></video>
  <div id="count"><div id="num"></div><div id="label"></div></div>
  <button id="snd" type="button"></button>
  <audio id="a" src="workshop-music.mp3" loop preload="auto"></audio>
  <div id="hint">Tap for full screen and music</div>
  <div id="pick" hidden>
    <div>Video not found. Choose countdown-loop.mp4 to start.</div>
    <input type="file" id="file" accept="video/*">
  </div>
</div>
<script>
  const v = document.getElementById('v'), count = document.getElementById('count'),
        num = document.getElementById('num'), label = document.getElementById('label'),
        hint = document.getElementById('hint'), pick = document.getElementById('pick'),
        file = document.getElementById('file');

  function sleeps() {
    const n = new Date(), today = new Date(n.getFullYear(), n.getMonth(), n.getDate()),
          xmas = new Date(n.getFullYear(), 11, 25);
    return Math.round((xmas - today) / 864e5);
  }
  function setText() {
    const s = sleeps();
    if (s > 1) {
      num.textContent = s; num.className = '';
      label.textContent = 'sleeps until Christmas';
    } else if (s === 1) {
      num.textContent = 'Santa’s coming tonight!'; num.className = 'greet'; label.textContent = '1 sleep to go';
    } else {
      num.textContent = 'Merry Christmas'; num.className = 'greet'; label.textContent = '';
    }
  }
  setText(); setInterval(setText, 60000);

  const a = document.getElementById('a'), snd = document.getElementById('snd');
  let musicOn = true;
  try { musicOn = localStorage.getItem('music') !== 'off'; } catch (e) {}
  function paintSnd() { snd.textContent = musicOn ? 'Music: on' : 'Music: off'; }
  function playMusic() { if (musicOn) { a.volume = 0.6; a.play().catch(() => {}); } else { a.pause(); } }
  snd.addEventListener('click', () => {
    musicOn = !musicOn;
    try { localStorage.setItem('music', musicOn ? 'on' : 'off'); } catch (e) {}
    paintSnd(); playMusic();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'm' || e.key === 'M') snd.click(); });
  paintSnd(); playMusic();

  let idleTimer;
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000); }
  ['pointermove', 'pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, wake));
  wake();

  async function start() {
    playMusic();
    try { await v.play(); } catch (e) { hint.textContent = 'Tap to start'; hint.style.opacity = 0.8; }
  }

  let lock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !lock) {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; });
      }
    } catch (e) {}
  }
  v.addEventListener('play', keepAwake);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  v.addEventListener('error', () => { pick.hidden = false; });
  file.addEventListener('change', () => {
    const f = file.files[0];
    if (f) { v.src = URL.createObjectURL(f); pick.hidden = true; start(); }
  });

  document.addEventListener('click', (e) => {
    if (e.target.closest('#pick, #snd')) return;
    start();
    const d = document.documentElement;
    if (!document.fullscreenElement) { (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d); }
    else if (document.exitFullscreen) { document.exitFullscreen(); }
    hint.style.opacity = 0;
  });
  setTimeout(() => { hint.style.opacity = 0; }, 6000);

  /* Pick up a new version when this page comes back into view, but never while the show is running:
     a reload would drop full screen and stop the music until someone taps again. */
  let pageTag = null;
  async function checkUpdate() {
    let t = null;
    try { const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
      if (r.ok) t = r.headers.get('etag') || r.headers.get('last-modified'); } catch (e) {}
    if (!t) return;
    if (pageTag === null) { pageTag = t; return; }
    if (t === pageTag || document.fullscreenElement || !a.paused) return;
    try { if (sessionStorage.getItem('reloadedFor') === t) return; sessionStorage.setItem('reloadedFor', t); } catch (e) {}
    location.reload();
  }
  if (/^http/.test(location.protocol)) {
    checkUpdate();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  }
</script>
</body>
</html>
