<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Santa’s Workshop</title>
<meta name="theme-color" content="#12372a">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: Georgia, "Palatino Linotype", Palatino, serif; color: #fbe9b7; }
  #stage { position: fixed; inset: 0; background: #000; }
  body.idle:not(.aligning) { cursor: none; }
  #v, #scene { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #v { object-fit: contain; background: #000; }
  #v[hidden], #scene[hidden] { display: none; }
  #count { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; text-align: center; pointer-events: none; color: var(--ink, #fbe9b7);
    text-shadow: 0 0.02em 0.06em var(--edge, transparent), 0 0.04em 0.35em var(--glow, rgba(70, 0, 0, 0.7)); padding: 0 4vw; }
  #count.high { justify-content: flex-start; padding-top: 3vh; }
  #num { font-size: min(30vh, 18vw); line-height: 1; font-weight: 700; font-variant-numeric: lining-nums; letter-spacing: -0.01em; }
  #num.greet { font-size: min(14vh, 9vw); }
  #label { font-size: min(7vh, 5vw); margin-top: 2vh; font-style: italic; letter-spacing: 0.01em; }
  #ctl { position: absolute; bottom: calc(3vh + env(safe-area-inset-bottom)); right: calc(3vw + env(safe-area-inset-right));
    display: flex; gap: max(1vh, 10px); }
  .btn { font: inherit; font-size: max(2.4vh, 15px); color: #fbe9b7; padding: max(0.8vh, 8px) max(1.6vh, 14px);
    background: rgba(18, 55, 42, 0.72); border: 1px solid rgba(251, 233, 183, 0.5); border-radius: 999px; cursor: pointer;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  .btn:focus-visible { outline: 3px solid #fbe9b7; outline-offset: 3px; }
  #ctl .btn { opacity: 0; transition: opacity 0.5s; }
  #ctl .btn:focus-visible { opacity: 1; }
  body:not(.idle) #ctl .btn { opacity: 1; }
  body.aligning #ctl, body.aligning #hint { display: none; }

  /* corner-pin alignment: the picture and countdown live in #warp, which is squashed onto the four saved corners */
  #warp { position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform-origin: 0 0; }
  body.aligning #warp::after { content: ''; position: absolute; inset: 0; pointer-events: none; outline: 3px solid #fff; outline-offset: -3px;
    background-image: linear-gradient(rgba(255,255,255,0.55) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.55) 1px, transparent 1px);
    background-size: 10% 10%; }
  #cal { position: absolute; inset: 0; z-index: 5; }
  #cal[hidden] { display: none; }
  .h { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; box-sizing: border-box; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font: 700 18px Georgia, serif; color: #fff;
    background: rgba(18, 55, 42, 0.6); border: 3px solid #fbe9b7; cursor: grab; touch-action: none; }
  .h.sel { background: #d62f2f; border-color: #fff; }
  #calbar { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, 70%); text-align: center;
    background: rgba(0, 0, 0, 0.78); border: 1px solid rgba(251, 233, 183, 0.5); border-radius: 14px; padding: 14px 16px;
    font-size: max(2.2vh, 15px); line-height: 1.4; }
  #calbar .row { display: flex; gap: 10px; justify-content: center; margin-top: 10px; }
  #hint { position: absolute; bottom: calc(3vh + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center;
    font-size: max(2.4vh, 15px); font-style: italic; color: #fbe9b7; opacity: 0.85; transition: opacity 1s; pointer-events: none;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8); padding: 0 4vw; }
  /* on a phone held upright the hint would sit on top of the music button, so lift it clear */
  @media (orientation: portrait) { #hint { bottom: calc(3vh + env(safe-area-inset-bottom) + max(6vh, 56px)); } }
  @media (prefers-reduced-motion: reduce) { #ctl .btn, #hint { transition: none; } }
  #pick { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 2vh; background: #000; font-size: max(3vh, 17px); color: #fbe9b7; cursor: auto;
    text-align: center; padding: 0 6vw; }
  #pick input { font: inherit; font-size: max(2.4vh, 16px); max-width: 100%; }
  #pick[hidden] { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="warp">
    <video id="v" muted loop playsinline preload="auto" hidden></video>
    <canvas id="scene" hidden></canvas>
    <div id="count"><div id="num"></div><div id="label"></div></div>
  </div>
  <div id="ctl">
    <button id="align" class="btn" type="button">Align</button>
    <button id="snd" class="btn" type="button"></button>
  </div>
  <audio id="a" src="workshop-music.mp3" loop preload="auto"></audio>
  <div id="hint">Tap for full screen and music</div>
  <div id="cal" hidden>
    <div id="calbar">
      Drag the four corners onto the edges of your screen.<br>
      Keys: 1 to 4 or Space picks a corner, arrows nudge (Shift for bigger), R resets, Enter saves. It saves as you go.
      <div class="row">
        <button id="calReset" class="btn" type="button">Reset</button>
        <button id="calDone" class="btn" type="button">Done</button>
      </div>
    </div>
  </div>
  <div id="pick" hidden>
    <div>Video not found. Choose countdown-loop.mp4 to start.</div>
    <input type="file" id="file" accept="video/*">
  </div>
</div>
<script>
  const v = document.getElementById('v'), count = document.getElementById('count'),
        num = document.getElementById('num'), label = document.getElementById('label'),
        hint = document.getElementById('hint'), pick = document.getElementById('pick'),
        file = document.getElementById('file'), cv = document.getElementById('scene'),
        stage = document.getElementById('stage');

  function sleeps() {
    const n = new Date(), today = new Date(n.getFullYear(), n.getMonth(), n.getDate()),
          xmas = new Date(n.getFullYear(), 11, 25);
    return Math.round((xmas - today) / 864e5);
  }
  /* add ?day=12 to the address to preview any day's scene, or ?tour to run through all of them */
  const qs = new URLSearchParams(location.search), forced = parseInt(qs.get('day'), 10);
  let tour = qs.has('tour') ? 33 : null;
  function whichDay() { return tour !== null ? tour : isFinite(forced) ? forced : sleeps(); }
  function setText(s) {
    if (s > 1) {
      num.textContent = s; num.className = '';
      label.textContent = 'sleeps until Christmas';
    } else if (s === 1) {
      num.textContent = 'Santa’s coming tonight!'; num.className = 'greet'; label.textContent = '1 sleep to go';
    } else {
      num.textContent = 'Merry Christmas'; num.className = 'greet'; label.textContent = '';
    }
  }

  const a = document.getElementById('a'), snd = document.getElementById('snd');
  let musicOn = true;
  try { musicOn = localStorage.getItem('music') !== 'off'; } catch (e) {}
  function paintSnd() { snd.textContent = musicOn ? 'Music: on' : 'Music: off'; }
  function playMusic() { if (musicOn) { a.volume = 0.6; a.play().catch(() => {}); } else { a.pause(); } }
  snd.addEventListener('click', () => {
    musicOn = !musicOn;
    try { localStorage.setItem('music', musicOn ? 'on' : 'off'); } catch (e) {}
    paintSnd(); playMusic();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'm' || e.key === 'M') snd.click(); });
  paintSnd(); playMusic();

  let idleTimer;
  function wake() { document.body.classList.remove('idle'); clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000); }
  ['pointermove', 'pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, wake));
  wake();

  /* ================= daily scenes: a different animated picture for every sleep ================= */
  const ctx = cv.getContext('2d', { alpha: false }), TAU = Math.PI * 2, MAXPX = 1280 * 720,
        sin = Math.sin, cos = Math.cos, abs = Math.abs, rnd = Math.random,
        MULTI = ['#ff4d5e', '#ffd84d', '#4dff88', '#4db8ff', '#ff7ae0'], WARM = ['#ffd27a', '#ffe6b0'];
  const S = { W: 2, H: 2, U: 1, q: 1 };   // canvas size in pixels; U is 1% of a 16:9 frame's height; q drops if the projector struggles

  function rng(seed) { let s = seed >>> 0;
    return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function mk(w, h) { const c = document.createElement('canvas'); c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h)); return c; }
  const cache = new Map();
  function spr(key, w, h, draw) { let c = cache.get(key); if (!c) { c = mk(w, h); draw(c.getContext('2d'), w, h); cache.set(key, c); } return c; }
  function rgb(hex) { const n = parseInt(hex.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
  function rgba(hex, al) { return 'rgba(' + rgb(hex).join(',') + ',' + al + ')'; }
  function mix(hex, f) { const t = f < 0 ? 0 : 255, p = abs(f); return 'rgb(' + rgb(hex).map((c) => Math.round(c + (t - c) * p)).join(',') + ')'; }
  function lin(g, x0, y0, x1, y1, stops) { const gr = g.createLinearGradient(x0, y0, x1, y1); for (const s of stops) gr.addColorStop(s[0], s[1]); return gr; }
  function sky(g, S, stops) { g.fillStyle = lin(g, 0, 0, 0, S.H, stops); g.fillRect(0, 0, S.W, S.H); }
  function reset(g) { g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
  function at(g, x, y, rot, s) { g.setTransform(s || 1, 0, 0, s || 1, x, y); if (rot) g.rotate(rot); }
  function put(g, c, w, ax, ay) { const h = w * c.height / c.width; g.drawImage(c, -w * (ax == null ? 0.5 : ax), -h * (ay == null ? 0.5 : ay), w, h); }
  function dot(g, c, x, y, r) { g.drawImage(c, x - r, y - r, r * 2, r * 2); }
  function circle(g, x, y, r, fill) { g.fillStyle = fill; g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, TAU); g.fill(); }
  function ell(g, x, y, rx, ry, rot, fill) { g.fillStyle = fill; g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot || 0, 0, TAU); g.fill(); }

  /* little pre-drawn pictures that get stamped many times a frame */
  function glow(hex, core) { core = core || 0.25;
    return spr('gl' + hex + core, 64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, rgba(hex, 1)); gr.addColorStop(core, rgba(hex, 0.6)); gr.addColorStop(1, rgba(hex, 0));
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64); }); }
  function bulb(hex) {
    return spr('bu' + hex, 64, 64, (g) => { const gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, rgba(hex, 0.85)); gr.addColorStop(0.22, rgba(hex, 0.4)); gr.addColorStop(1, rgba(hex, 0));
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      const c = g.createRadialGradient(30, 30, 0, 32, 32, 8); c.addColorStop(0, '#ffffff'); c.addColorStop(0.45, mix(hex, 0.45)); c.addColorStop(1, hex);
      circle(g, 32, 32, 8, c); }); }
  function glint(hex) {
    return spr('gi' + hex, 64, 64, (g) => { g.translate(32, 32); g.fillStyle = hex; g.beginPath();
      for (let i = 0; i < 8; i++) { const an = i * Math.PI / 4, r = i % 2 ? 3.5 : 31; g.lineTo(cos(an) * r, sin(an) * r); }
      g.closePath(); g.fill(); const gr = g.createRadialGradient(0, 0, 0, 0, 0, 16); gr.addColorStop(0, rgba(hex, 0.9)); gr.addColorStop(1, rgba(hex, 0));
      g.fillStyle = gr; g.fillRect(-16, -16, 32, 32); }); }
  function shade(g, S, al) {   // darkens the middle a little so the countdown always reads
    const c = spr('shade', 128, 128, (m) => { const gr = m.createRadialGradient(64, 64, 0, 64, 64, 64);
      gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.55, 'rgba(0,0,0,0.6)'); gr.addColorStop(1, 'rgba(0,0,0,0)'); m.fillStyle = gr; m.fillRect(0, 0, 128, 128); });
    g.globalAlpha = al; g.drawImage(c, S.W / 2 - S.H * 0.85, S.H * 0.06, S.H * 1.7, S.H * 0.84); g.globalAlpha = 1; }

  /* things that move: snow, twinkling stars, soft lights, falling objects, sparkles */
  function Snow(R, n, o) {
    o = Object.assign({ v: 0.06, size: 0.55, wind: 0.008, sway: 0.012, col: '#ffffff' }, o);
    const f = []; for (let i = 0; i < n; i++) f.push([R(), R() * 1.04 - 0.02, 0.35 + 0.65 * R(), R() * TAU]);
    return { step(g, S, t, dt) { const c = glow(o.col, 0.45);
      for (const p of f) {
        p[1] += o.v * p[2] * dt; p[0] += (o.wind + sin(t * 0.9 + p[3]) * o.sway) * p[2] * dt;
        if (p[1] > 1.03) { p[1] = -0.02; p[0] = rnd(); }
        if (p[0] > 1.02) p[0] -= 1.04; else if (p[0] < -0.02) p[0] += 1.04;
        g.globalAlpha = 0.3 + 0.7 * p[2]; dot(g, c, p[0] * S.W, p[1] * S.H, o.size * S.U * (0.5 + p[2])); }
      g.globalAlpha = 1; } };
  }
  function Stars(R, n, y1, col) {
    const f = []; for (let i = 0; i < n; i++) f.push([R(), R() * y1, 0.2 + R() * 0.55, R() * TAU, 0.5 + R() * 2]);
    return { step(g, S, t) { const c = glow(col || '#fff8e0', 0.18);
      for (const s of f) { const k = 0.5 + 0.5 * sin(t * s[4] + s[3]); g.globalAlpha = 0.25 + 0.75 * k; dot(g, c, s[0] * S.W, s[1] * S.H, s[2] * S.U * (0.9 + 0.7 * k)); }
      g.globalAlpha = 1; } };
  }
  function Bokeh(R, n, cols, o) {
    o = Object.assign({ size: 6, v: 0.012, alpha: 0.3 }, o);
    const f = []; for (let i = 0; i < n; i++) f.push([R(), R() * 1.2 - 0.1, 0.4 + 0.6 * R(), R() * TAU, cols[i % cols.length]]);
    return { step(g, S, t, dt) {
      for (const b of f) { b[1] -= o.v * b[2] * dt; if (b[1] < -0.12) { b[1] = 1.12; b[0] = rnd(); }
        g.globalAlpha = o.alpha * (0.55 + 0.45 * sin(t * 0.6 + b[3]));
        dot(g, glow(b[4], 0.6), (b[0] + sin(t * 0.17 + b[3]) * 0.012) * S.W, b[1] * S.H, o.size * S.U * b[2]); }
      g.globalAlpha = 1; } };
  }
  function Fall(R, n, imgs, o) {
    o = Object.assign({ size: 6, v: 0.06, spin: 1, sway: 0.01 }, o);
    const f = []; for (let i = 0; i < n; i++) f.push({ x: R(), y: R() * 1.24 - 0.12, z: 0.55 + 0.45 * R(), r: R() * TAU, s: R() * 2 - 1, p: R() * TAU, k: i % imgs.length });
    return { step(g, S, t, dt) {
      for (const p of f) { p.y += o.v * p.z * dt; p.r += o.spin * p.s * dt;
        if (p.y > 1.12) { p.y = -0.12; p.x = rnd(); }
        at(g, (p.x + sin(t * 0.7 + p.p) * o.sway) * S.W, p.y * S.H, p.r); put(g, imgs[p.k], o.size * S.U * p.z); }
      g.setTransform(1, 0, 0, 1, 0, 0); } };
  }
  function Glints(R, n, cols, o) {
    o = Object.assign({ size: 2.4, y0: 0, y1: 1, rate: 0.9 }, o);
    const f = []; for (let i = 0; i < n; i++) f.push({ x: R(), y: o.y0 + R() * (o.y1 - o.y0), p: R() * TAU, s: 0.6 + R() * 0.8, c: cols[i % cols.length], n: null });
    return { step(g, S, t) {
      for (const p of f) { const ph = t * o.rate * p.s + p.p, cyc = Math.floor(ph / TAU);
        if (p.n !== null && cyc !== p.n) { p.x = rnd(); p.y = o.y0 + rnd() * (o.y1 - o.y0); } p.n = cyc;
        const k = sin(ph); if (k <= 0) continue;
        g.globalAlpha = k; dot(g, glint(p.c), p.x * S.W, p.y * S.H, o.size * S.U * (0.5 + 0.7 * k)); }
      g.globalAlpha = 1; } };
  }

  /* shapes */
  function hill(g, S, y, amp, freq, ph, fill) {
    g.beginPath(); g.moveTo(0, S.H);
    for (let i = 0; i <= 64; i++) { const u = i / 64; g.lineTo(u * S.W, S.H * (y + amp * sin(u * freq * TAU + ph) + amp * 0.45 * sin(u * freq * 2.7 * TAU + ph * 1.9))); }
    g.lineTo(S.W, S.H); g.closePath(); g.fillStyle = fill; g.fill(); }
  function pine(g, x, y, h, col, snow, trunk) {
    const w = h * 0.62, n = 4, tr = h * 0.09, bh = h - tr;
    g.fillStyle = trunk || '#2b1a10'; g.fillRect(x - w * 0.055, y - tr - 1, w * 0.11, tr + 1);
    for (let i = 0; i < n; i++) {
      const yb = y - tr - bh * i / (n + 0.6), yt = Math.max(y - h, yb - bh * 1.7 / (n + 0.6)), hw = w / 2 * (1 - i / (n + 0.9));
      g.fillStyle = col; g.beginPath(); g.moveTo(x, yt); g.lineTo(x + hw, yb); g.quadraticCurveTo(x, yb + (yb - yt) * 0.12, x - hw, yb); g.closePath(); g.fill();
      if (snow) { const sy = yt + (yb - yt) * 0.38, sw = hw * 0.38; g.fillStyle = snow; g.beginPath(); g.moveTo(x, yt); g.lineTo(x + sw, sy);
        g.quadraticCurveTo(x + sw * 0.4, sy - (sy - yt) * 0.25, x, sy + (sy - yt) * 0.1); g.quadraticCurveTo(x - sw * 0.4, sy - (sy - yt) * 0.25, x - sw, sy); g.closePath(); g.fill(); }
    }
  }
  function house(g, x, y, w, h, wall, roof, win) {   // x = left edge, y = ground; returns the roofline for lights
    const rh = w * 0.42, ox = w * 0.1, top = y - h;
    g.fillStyle = mix(wall, -0.3); g.fillRect(x + w * 0.66, top - rh * 0.95, w * 0.13, rh * 0.8);
    g.fillStyle = wall; g.fillRect(x, top, w, h);
    g.fillStyle = roof; g.beginPath(); g.moveTo(x - ox, top + 1); g.lineTo(x + w / 2, top - rh); g.lineTo(x + w + ox, top + 1); g.closePath(); g.fill();
    g.fillStyle = '#eef3ff'; g.beginPath(); g.moveTo(x - ox, top + 1); g.lineTo(x + w / 2, top - rh); g.lineTo(x + w + ox, top + 1);
    g.lineTo(x + w + ox * 0.3, top + w * 0.05); g.lineTo(x + w / 2, top - rh + w * 0.12); g.lineTo(x - ox * 0.3, top + w * 0.05); g.closePath(); g.fill();
    win = win || '#ffd47a'; const ww = w * 0.2, wh = h * 0.3, wy = top + h * 0.22;
    for (const wx of [x + w * 0.15, x + w * 0.65]) {
      g.globalAlpha = 0.4; dot(g, glow(win, 0.25), wx + ww / 2, wy + wh / 2, ww * 1.5); g.globalAlpha = 1;
      g.fillStyle = win; g.fillRect(wx, wy, ww, wh);
      g.strokeStyle = mix(wall, -0.35); g.lineWidth = Math.max(1, w * 0.018); g.beginPath();
      g.moveTo(wx + ww / 2, wy); g.lineTo(wx + ww / 2, wy + wh); g.moveTo(wx, wy + wh / 2); g.lineTo(wx + ww, wy + wh / 2); g.stroke(); }
    g.fillStyle = mix(wall, -0.45); g.fillRect(x + w * 0.41, y - h * 0.5, w * 0.18, h * 0.5);
    return [[x - ox, top], [x + w / 2, top - rh], [x + w + ox, top]];
  }
  function along(pts, step) { const out = [];
    for (let i = 1; i < pts.length; i++) { const p = pts[i - 1], q = pts[i], n = Math.max(1, Math.round(Math.hypot(q[0] - p[0], q[1] - p[1]) / step));
      for (let j = i === 1 ? 0 : 1; j <= n; j++) out.push([p[0] + (q[0] - p[0]) * j / n, p[1] + (q[1] - p[1]) * j / n]); }
    return out; }
  function sag(x0, y0, x1, y1, ym, n) { const cx = (x0 + x1) / 2, cy = 2 * ym - (y0 + y1) / 2, out = [];
    for (let i = 0; i <= n; i++) { const t = i / n, p = (1 - t) * (1 - t), q = 2 * (1 - t) * t, r = t * t; out.push([p * x0 + q * cx + r * x1, p * y0 + q * cy + r * y1]); }
    return out; }
  function starPath(g, x, y, r1, r2, n, rot) { g.beginPath();
    for (let i = 0; i < n * 2; i++) { const an = (rot || 0) - Math.PI / 2 + i * Math.PI / n, r = i % 2 ? r2 : r1; g.lineTo(x + cos(an) * r, y + sin(an) * r); }
    g.closePath(); }
  function goldStar(g, x, y, r, k) {
    g.globalAlpha = 0.45 + 0.35 * k; dot(g, glow('#ffe9a0', 0.15), x, y, r * (3 + k)); g.globalAlpha = 1;

          g.globalAlpha = 1 - pul; g.strokeStyle = '#ff6b6b'; g.lineWidth = S.U * 0.4; g.beginPath(); g.arc(sx, sy, S.U * (1.5 + pul * 6), 0, TAU); g.stroke();
          g.globalAlpha = 1; dot(g, glow('#ff4d4d', 0.35), sx, sy, S.U * 2.6); circle(g, sx, sy, S.U * 0.7, '#ffd0d0');
          g.fillStyle = '#ff9d9d'; g.font = mono(S.U * 2.4, true); g.textAlign = 'left'; g.textBaseline = 'middle'; g.fillText('SANTA', sx + S.U * 3, sy - S.U * 1.5);
          if ((t % 1.2) < 0.7) { circle(g, S.W - S.U * 6, S.U * 5.2, S.U * 0.9, '#ff4d4d'); g.fillStyle = 'rgba(255,140,140,0.9)'; g.textAlign = 'right'; g.fillText('LIVE', S.W - S.U * 8, S.U * 5.3); } } };
    },
    1: (R) => {   // Christmas Eve: Santa's sleigh crossing the moon
      const stars = Stars(R, 90, 0.6), snow = Snow(R, 70, { v: 0.04, size: 0.45 }), trail = [], homes = [];
      for (let x = -0.03; x < 1;) { const w = 0.06 + R() * 0.045; homes.push({ x, w, h: 0.5 + R() * 0.3 }); x += w + 0.012 + R() * 0.02; }
      let lights = [];
      return { ink: '#fff4d6', glow: 'rgba(5,10,40,0.9)', edge: 'rgba(0,5,25,0.95)',
        bg(g, S) { sky(g, S, [[0, '#030820'], [1, '#14295a']]); fullMoon(g, S.W * 0.72, S.H * 0.3, S.H * 0.2); shade(g, S, 0.15); },
        back(g, S, t, dt) { stars.step(g, S, t);
          const u = (t % 15) / 11, col = '#0b1024';
          if (u < 1) { const x = (-0.3 + u * 1.65) * S.W, y = S.H * (0.4 - sin(u * Math.PI) * 0.17), s = S.U * 14, ds = s * 0.62;
            for (let i = 0; i < 3; i++) trail.push({ x: x - s * 0.5 + (rnd() - 0.5) * S.U * 2, y: y - s * 0.2 + (rnd() - 0.5) * S.U * 2, l: 0 });
            g.strokeStyle = col; g.lineWidth = Math.max(1, S.U * 0.2); g.beginPath(); g.moveTo(x + s * 0.35, y - s * 0.25); g.lineTo(x + s * 0.45 + 3 * ds, y - s * 0.3); g.stroke();
            for (let i = 0; i < 4; i++) { const dx = x + s * 0.45 + i * ds, dy = y - s * 0.28 + sin(t * 5 + i) * S.U * 0.5; at(g, dx, dy, -0.08); deer(g, ds, col, t * 9 + i * 0.8);
              if (i === 3) { const nx = dx + cos(-0.08) * ds * 0.514 - sin(-0.08) * -ds * 0.276, ny = dy + sin(-0.08) * ds * 0.514 + cos(-0.08) * -ds * 0.276;
                g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 0.85 + 0.15 * sin(t * 6); dot(g, glow('#ff3030', 0.25), nx, ny, S.U * 2.4); g.globalAlpha = 1; } }
            at(g, x, y, -0.05); sleighShape(g, s, col, true); g.setTransform(1, 0, 0, 1, 0, 0); }
          g.globalCompositeOperation = 'lighter';
          for (let i = trail.length - 1; i >= 0; i--) { const p = trail[i]; p.l += dt; if (p.l > 1.8) { cull(trail, i); continue; } p.y += S.U * 3 * dt; const k = 1 - p.l / 1.8;
            g.globalAlpha = 0.85 * k; dot(g, glow('#ffd86b', 0.3), p.x + sin(p.l * 9 + i) * S.U * 0.6, p.y, S.U * (0.5 + 0.9 * k)); }
          reset(g); },
        mid(g, S) { lights = []; const gy = S.H * 0.97;
          for (const h of homes) { const w = h.w * S.W, p = house(g, h.x * S.W, gy, w, w * h.h, '#141a36', '#0c1026', '#ffcf73'); along(p, S.U * 2.6).forEach((q, i) => lights.push([q[0], q[1], WARM[i % 2], i * 1.9 + h.x * 20])); }
          hill(g, S, 0.965, 0.004, 2, 0.2, '#e6edfb'); },
        draw(g, S, t, dt) { for (const l of lights) { const k = 0.5 + 0.5 * sin(t * 2 + l[3]); g.globalAlpha = 0.45 + 0.55 * k; dot(g, bulb(l[2]), l[0], l[1], S.U * 1.5); } g.globalAlpha = 1; snow.step(g, S, t, dt); } };
    },
    0: (R) => {   // Christmas Day: fireworks and confetti
      const rockets = [], sparks = [], conf = Fall(R, 40, CONF.map(confetti), { size: 1.2, v: 0.08, spin: 4, sway: 0.02 }), homes = [];
      for (let x = -0.03; x < 1;) { const w = 0.06 + R() * 0.045; homes.push({ x, w, h: 0.5 + R() * 0.3 }); x += w + 0.012 + R() * 0.02; }
      let next = 0.2;
      return { ink: '#ffffff', glow: 'rgba(10,5,40,0.9)', edge: 'rgba(5,0,25,0.95)',
        bg(g, S) { sky(g, S, [[0, '#02010a'], [1, '#0e0c2c']]); shade(g, S, 0.15); },
        back(g, S, t, dt) {
          if (t > next) { next = t + 0.3 + rnd() * 0.6; rockets.push({ x: 0.08 + rnd() * 0.84, y: 1, vy: -(0.55 + rnd() * 0.2), ty: 0.1 + rnd() * 0.35, c: CONF[Math.floor(rnd() * 5)] }); }
          g.globalCompositeOperation = 'lighter';
          for (let i = rockets.length - 1; i >= 0; i--) { const r = rockets[i]; r.y += r.vy * dt; dot(g, glow('#ffe9b0', 0.3), r.x * S.W, r.y * S.H, S.U * 1.2);
            if (r.y <= r.ty) { cull(rockets, i); const c2 = rnd() < 0.4 ? CONF[Math.floor(rnd() * 5)] : r.c;
              for (let j = 0; j < 48; j++) { const an = j / 48 * TAU + rnd() * 0.08, sp = S.H * (0.17 + rnd() * 0.05); sparks.push({ x: r.x * S.W, y: r.y * S.H, vx: cos(an) * sp, vy: sin(an) * sp, l: 0, L: 1.3 + rnd() * 0.6, c: j % 2 ? r.c : c2 }); } } }
          for (let i = sparks.length - 1; i >= 0; i--) { const p = sparks[i]; p.l += dt; if (p.l > p.L) { cull(sparks, i); continue; }
            const dr = 1 - 1.2 * dt; p.vx *= dr; p.vy = p.vy * dr + S.H * 0.12 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
            const k = 1 - p.l / p.L; g.globalAlpha = k; dot(g, glow(p.c, 0.3), p.x, p.y, S.U * (0.5 + 1.3 * k)); }
          reset(g); },
        mid(g, S) { const gy = S.H * 0.98; for (const h of homes) { const w = h.w * S.W; house(g, h.x * S.W, gy, w, w * h.h, '#120f2a', '#0a0820', '#ffcf73'); } hill(g, S, 0.975, 0.003, 2, 0.2, '#dfe6f7'); },
        draw(g, S, t, dt) { conf.step(g, S, t, dt); } };
    },
  };

  /* ================= scene engine ================= */
  const VIDEO = { ink: '#fbe9b7', glow: 'rgba(70,0,0,0.7)', edge: 'transparent' };   // day 33 and any day without a scene keep the red video
  let sc = null, layers = null, raf = 0, lastT = 0, sceneT = 0, slow = 0;
  function trim(c) {   // only the rows with something drawn get copied each frame
    const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data, w = c.width * 4;
    let y0 = -1, y1 = -1;
    for (let y = 0; y < c.height; y++) for (let i = y * w + 3, e = i + w; i < e; i += 4) if (d[i]) { if (y0 < 0) y0 = y; y1 = y; break; }
    return y0 < 0 ? null : { c, y0, y1: y1 + 1 };
  }
  function paint(fn) { const c = mk(S.W, S.H); fn(c.getContext('2d'), S); return trim(c); }
  function build() {
    const w = stage.clientWidth || innerWidth, h = stage.clientHeight || innerHeight,
          k = Math.min(window.devicePixelRatio || 1, Math.sqrt(MAXPX / (w * h))) * S.q;
    S.W = cv.width = Math.max(2, Math.round(w * k)); S.H = cv.height = Math.max(2, Math.round(h * k));
    S.U = Math.min(S.H, S.W * 0.5625) / 100;
    if (sc.layout) sc.layout(S);
    const bg = mk(S.W, S.H); sc.bg(bg.getContext('2d'), S);
    layers = { bg, mid: sc.mid ? paint(sc.mid) : null, fg: sc.fg ? paint(sc.fg) : null };
  }
  function blit(L) { if (L) ctx.drawImage(L.c, 0, L.y0, L.c.width, L.y1 - L.y0, 0, L.y0, L.c.width, L.y1 - L.y0); }
  function drawFrame(t, dt) {
    reset(ctx); ctx.drawImage(layers.bg, 0, 0);
    if (sc.back) { sc.back(ctx, S, t, dt); reset(ctx); }
    blit(layers.mid);
    if (sc.draw) { sc.draw(ctx, S, t, dt); reset(ctx); }
    blit(layers.fg);
  }
  function frame(now) {
    raf = requestAnimationFrame(frame);
    const gap = now - lastT;
    if (gap < 30) return;   // about 30 frames a second is plenty and halves the work for the projector
    lastT = now;
    const dt = Math.min(gap, 100) / 1000; sceneT += dt;
    try { drawFrame(sceneT, dt); } catch (e) { console.error(e); showVideo(); return; }
    if (gap > 60 && gap < 1000) { if (++slow > 45 && S.q > 0.5) { S.q = Math.max(0.5, S.q * 0.8); slow = 0; build(); } }   // struggling: draw at a lower resolution
    else if (slow > 0) slow -= 0.25;
  }
  function run() { if (!raf && sc && !document.hidden) { lastT = 0; raf = requestAnimationFrame(frame); } }
  function stopScene() { if (raf) cancelAnimationFrame(raf); raf = 0; }
  function paintText(th) { count.classList.toggle('high', !!th.high); count.style.setProperty('--ink', th.ink); count.style.setProperty('--glow', th.glow); count.style.setProperty('--edge', th.edge || 'transparent'); }
  function showVideo() {
    stopScene(); sc = null; layers = null; paintText(VIDEO); cv.hidden = true; v.hidden = false;
    if (!v.getAttribute('src')) v.src = 'countdown-loop.mp4';
    v.play().catch(() => {});
  }
  function setScene(d) {
    stopScene(); sc = null; cache.clear();
    const make = d <= 0 ? SCENES[0] : SCENES[d];
    if (make) { try { sc = make(rng(d * 7919 + 17)); sceneT = 0; slow = 0; build(); } catch (e) { console.error(e); sc = null; } }
    if (!sc) { showVideo(); return; }
    paintText(sc);
    v.hidden = true; v.pause(); if (v.getAttribute('src')) { v.removeAttribute('src'); v.load(); }
    cv.hidden = false; run(); keepAwake();
  }
  let rsTimer = 0;
  window.addEventListener('resize', () => { clearTimeout(rsTimer);
    rsTimer = setTimeout(() => { if (sc) { try { build(); } catch (e) { console.error(e); showVideo(); } } }, 150); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopScene(); else run(); });
  let shown = null;
  function refresh() { const d = whichDay(); if (d === shown) return; shown = d; setText(d); setScene(d); }

  async function start() {
    playMusic(); keepAwake();
    if (!v.hidden) { try { await v.play(); } catch (e) { hint.textContent = 'Tap to start'; hint.style.opacity = 0.8; } }
  }

  let lock = null;
  async function keepAwake() {
    try {
      if ('wakeLock' in navigator && !lock) {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; });
      }
    } catch (e) {}
  }
  v.addEventListener('play', keepAwake);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

  v.addEventListener('error', () => { if (!v.hidden && v.getAttribute('src')) pick.hidden = false; });
  file.addEventListener('change', () => {
    const f = file.files[0];
    if (f) { v.src = URL.createObjectURL(f); pick.hidden = true; start(); }
  });

  /* ---- corner pin: line the picture up with the screen once, saved on this device ---- */
  const warp = document.getElementById('warp'), cal = document.getElementById('cal'), alignBtn = document.getElementById('align');
  const HOME = [[0, 0], [1, 0], [1, 1], [0, 1]];   // top left, top right, bottom right, bottom left, as fractions of the screen
  let corners = HOME.map((p) => p.slice()), aligning = false, sel = 0;
  try {
    const s = JSON.parse(localStorage.getItem('warp'));
    if (Array.isArray(s) && s.length === 4 && s.every((p) => Array.isArray(p) && p.length === 2 && p.every((n) => typeof n === 'number' && isFinite(n))))
      corners = s.map((p) => [Math.min(1, Math.max(0, p[0])), Math.min(1, Math.max(0, p[1]))]);
  } catch (e) {}

  function solve(A, b) {   // plain Gaussian elimination, returns null if the corners are degenerate
    const n = b.length, M = A.map((r, i) => r.concat(b[i]));
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(M[r][c]) > Math.abs(M[p][c])) p = r;
      if (Math.abs(M[p][c]) < 1e-9) return null;
      [M[c], M[p]] = [M[p], M[c]];
      for (let r = 0; r < n; r++) if (r !== c) {
        const f = M[r][c] / M[c][c];
        for (let k = c; k <= n; k++) M[r][k] -= f * M[c][k];
      }
    }
    return M.map((r, i) => r[n] / r[i]);
  }
  function applyWarp() {
    const w = stage.clientWidth, h = stage.clientHeight;
    if (!w || !h) return;
    if (corners.every((p, i) => p[0] === HOME[i][0] && p[1] === HOME[i][1])) { warp.style.transform = ''; return; }
    const src = [[0, 0], [w, 0], [w, h], [0, h]], A = [], b = [];
    corners.forEach((c, i) => {
      const x = src[i][0], y = src[i][1], u = c[0] * w, t = c[1] * h;
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -t * x, -t * y]); b.push(t);
    });
    const m = solve(A, b);
    if (!m) return;
    warp.style.transform = 'matrix3d(' + [m[0], m[3], 0, m[6], m[1], m[4], 0, m[7], 0, 0, 1, 0, m[2], m[5], 0, 1].join(',') + ')';
  }
  const handles = HOME.map((_, i) => {
    const el = document.createElement('div');
    el.className = 'h'; el.textContent = i + 1;
    el.addEventListener('pointerdown', (e) => { select(i); el.setPointerCapture(e.pointerId); e.preventDefault(); });
    el.addEventListener('pointermove', (e) => {
      if (!el.hasPointerCapture(e.pointerId)) return;
      const r = stage.getBoundingClientRect();
      move(i, (e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height);
    });
    cal.appendChild(el);
    return el;
  });
  function paintHandles() {
    handles.forEach((el, i) => {
      el.style.left = corners[i][0] * 100 + '%'; el.style.top = corners[i][1] * 100 + '%';
      el.classList.toggle('sel', i === sel);
    });
  }
  function select(i) { sel = i; paintHandles(); }
  function move(i, x, y) {
    corners[i] = [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, y))];
    applyWarp(); paintHandles();
    try { localStorage.setItem('warp', JSON.stringify(corners)); } catch (e) {}
  }
  function nudge(dx, dy) {
    move(sel, corners[sel][0] + dx / stage.clientWidth, corners[sel][1] + dy / stage.clientHeight);
  }
  function setAligning(on) {
    aligning = on;
    document.body.classList.toggle('aligning', on);
    cal.hidden = !on;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    if (on) paintHandles();
    wake();
  }
  alignBtn.addEventListener('click', () => setAligning(true));
  document.getElementById('calDone').addEventListener('click', () => setAligning(false));
  document.getElementById('calReset').addEventListener('click', () => {
    corners = HOME.map((p) => p.slice());
    applyWarp(); paintHandles();
    try { localStorage.removeItem('warp'); } catch (e) {}
  });
  document.addEventListener('keydown', (e) => {
    if (!aligning) { if (e.key === 'a' || e.key === 'A') setAligning(true); return; }
    const big = e.shiftKey ? 10 : 2;
    if (e.key >= '1' && e.key <= '4') select(+e.key - 1);
    else if (e.key === ' ' || e.key === 'Tab') select((sel + (e.shiftKey ? 3 : 1)) % 4);
    else if (e.key === 'ArrowLeft') nudge(-big, 0);
    else if (e.key === 'ArrowRight') nudge(big, 0);
    else if (e.key === 'ArrowUp') nudge(0, -big);
    else if (e.key === 'ArrowDown') nudge(0, big);
    else if (e.key === 'r' || e.key === 'R') document.getElementById('calReset').click();
    else if (e.key === 'Enter' || e.key === 'Escape') setAligning(false);
    else return;
    e.preventDefault();
  });
  window.addEventListener('resize', applyWarp);
  document.addEventListener('fullscreenchange', applyWarp);
  applyWarp();

  document.addEventListener('click', (e) => {
    if (aligning || e.target.closest('#pick, #ctl, #cal')) return;
    start();
    const d = document.documentElement;
    if (!document.fullscreenElement) { (d.requestFullscreen || d.webkitRequestFullscreen || function () {}).call(d); }
    else if (document.exitFullscreen) { document.exitFullscreen(); }
    hint.style.opacity = 0;
  });
  setTimeout(() => { hint.style.opacity = 0; }, 6000);

  /* Pick up a new version when this page comes back into view, but never while the show is running:
     a reload would drop full screen and stop the music until someone taps again. */
  let pageTag = null;
  async function checkUpdate() {
    let t = null;
    try { const r = await fetch(location.pathname, { method: 'HEAD', cache: 'no-store' });
      if (r.ok) t = r.headers.get('etag') || r.headers.get('last-modified'); } catch (e) {}
    if (!t) return;
    if (pageTag === null) { pageTag = t; return; }
    if (t === pageTag || document.fullscreenElement || !a.paused) return;
    try { if (sessionStorage.getItem('reloadedFor') === t) return; sessionStorage.setItem('reloadedFor', t); } catch (e) {}
    location.reload();
  }
  if (/^http/.test(location.protocol)) {
    checkUpdate();
    document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  }

  /* start on today's scene, switch at midnight */
  refresh(); setInterval(refresh, 30000);
  if (tour !== null) setInterval(() => { tour = tour > 0 ? tour - 1 : 33; refresh(); }, 8000);
</script>
</body>
